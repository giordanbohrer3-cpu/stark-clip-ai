<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0614" />
  <title>Clipzou offline</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b0614;
      color: #e6f1ff; font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 420px; text-align: center; border: 1px solid rgb(56 189 248 / .25); border-radius: 16px;
      padding: 28px 22px; background: rgb(12 18 34 / .8); }
    img { width: 72px; height: 72px; border-radius: 50%; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { color: #8ea4c8; margin: 0 0 8px; }
    button { margin-top: 16px; height: 44px; padding: 0 20px; border: 0; border-radius: 10px; font-weight: 600;
      background: linear-gradient(90deg, #e83cc4, #22d3ee); color: #021018; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sem conexão com o Clipzou</h1>
    <p>O app roda no seu PC. Confira se o PC está ligado com <b>pnpm start</b> rodando.</p>
    <p>No celular: Tailscale ativo no PC e no telefone.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
