[project]
name = "stark-engine"
version = "0.1.0"
description = "STARK CLIP AI - motor de cortes, legendas, render e publicação"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.10,<5",  # 5.x removeu CascadeClassifier
  "faster-whisper>=1.1",
  "psycopg[binary]>=3.2",
  "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: pipeline completo com ffmpeg + whisper real (lento)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stark_engine"]
